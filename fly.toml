# Fly.io config. Set the login password before first use:
#   fly secrets set APP_PASSWORD='at-least-12-characters'
# Create the data volume once:
#   fly volumes create gst_data --size 1 --region bom
app = "gst-billing-smit"
primary_region = "bom"

[build]

[env]
  HOSTED = "1"
  STORAGE_DIR = "/data"
  PORT = "8080"

[mounts]
  source = "gst_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
