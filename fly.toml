# fly.toml app configuration file generated for gst-billing-smit on 2026-10-30T12:30:37Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = "gst-billing-smit"
primary_region = 'lhr'
swap_size_mb = 512

[build]

[env]
  HOSTED = "1"
  STORAGE_DIR = "/data"
  PORT = "8080"

[mounts]
  source = "gst_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  checks = [{ grace_period = '20s', interval = '30s', method = 'GET', path = '/healthz', timeout = '5s' }]

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
