# fly.toml app configuration file generated for gst-billinig-app on 2026-10-30T13:22:01Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gst-billinig-app'
primary_region = 'lhr'
swap_size_mb = 512

[build]

[env]
  HOSTED = '1'
  PORT = '8080'
  STORAGE_DIR = '/data'

[[mounts]]
  source = 'gst_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
